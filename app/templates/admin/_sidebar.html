<div class="admin-sidebar">
    <nav class="admin-nav">
        <a href="{{ url_for('admin.dashboard') }}" class="nav-item {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
            <i class="fas fa-gauge"></i> Dashboard
        </a>
        <a href="{{ url_for('admin.suspicious') }}" class="nav-item {% if request.endpoint == 'admin.suspicious' %}active{% endif %}">
            <i class="fas fa-triangle-exclamation"></i> Suspicious
        </a>
        <a href="{{ url_for('admin.alerts') }}" class="nav-item {% if request.endpoint == 'admin.alerts' %}active{% endif %}">
            <i class="fas fa-bell"></i> Alerts
            <span class="badge" id="adminSidebarAlertsBadge" style="background:#ef4444;color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:auto;{% if not unread_alerts_count %}display:none;{% endif %}">{{ unread_alerts_count or 0 }}</span>
        </a>
        <a href="{{ url_for('admin.users') }}" class="nav-item {% if request.endpoint == 'admin.users' %}active{% endif %}">
            <i class="fas fa-users"></i> Users
            <span class="badge" id="adminSidebarUsersBadge" style="background:#f59e0b;color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-left:auto;{% if not pending_users_count %}display:none;{% endif %}">{{ pending_users_count or 0 }}</span>
        </a>
        <a href="{{ url_for('admin.reports') }}" class="nav-item {% if request.endpoint == 'admin.reports' %}active{% endif %}">
            <i class="fas fa-chart-bar"></i> Reports
        </a>
        <a href="{{ url_for('admin.audit_logs') }}" class="nav-item {% if request.endpoint == 'admin.audit_logs' %}active{% endif %}">
            <i class="fas fa-list-check"></i> Audit Logs
        </a>
        <a href="{{ url_for('admin.settings') }}" class="nav-item {% if request.endpoint == 'admin.settings' %}active{% endif %}">
            <i class="fas fa-cog"></i> Settings
        </a>
    </nav>
    <a href="{{ url_for('auth.logout') }}" class="nav-item nav-logout">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
(function() {
    function playSecurityAlertSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) {}
    }

    function showAdminToast(title, message) {
        let container = document.getElementById('adminToastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'adminToastContainer';
            container.style.cssText = 'position:fixed; top:20px; right:20px; z-index:99999; display:flex; flex-direction:column; gap:10px; pointer-events:none;';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.style.cssText = 'background:#dc2626; color:#ffffff; padding:14px 18px; border-radius:10px; box-shadow:0 10px 25px rgba(220,38,38,0.4); font-size:13px; font-weight:600; display:flex; align-items:center; gap:12px; min-width:320px; pointer-events:auto; animation:slideInRight 0.3s ease;';
        toast.innerHTML = `
            <i class="fas fa-shield-cat" style="font-size:20px; color:#fef08a;"></i>
            <div style="flex:1;">
                <div style="font-weight:700; text-transform:uppercase; font-size:11px; color:#fef08a; letter-spacing:0.5px;">⚠️ THREAT DETECTED & AUTO-BLOCKED</div>
                <div style="margin-top:2px;">${message}</div>
            </div>
            <button onclick="this.parentElement.remove()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer; padding:0 4px;">&times;</button>
        `;
        container.appendChild(toast);
        playSecurityAlertSound();
        setTimeout(() => { if (toast.parentElement) toast.remove(); }, 6000);
    }

    let lastUnreadCount = null;
    async function checkAdminAlerts() {
        try {
            const res = await fetch('/admin/api/unread-alerts');
            if (res.ok) {
                const data = await res.json();
                const badge = document.getElementById('adminSidebarAlertsBadge');
                if (badge) {
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
                
                const usersBadge = document.getElementById('adminSidebarUsersBadge');
                if (usersBadge) {
                    if (data.pending_users_count > 0) {
                        usersBadge.textContent = data.pending_users_count;
                        usersBadge.style.display = 'inline-block';
                    } else {
                        usersBadge.style.display = 'none';
                    }
                }
                
                if (lastUnreadCount !== null && data.unread_count > lastUnreadCount && data.latest_alert) {
                    const msg = `User <strong>${data.latest_alert.username || 'User'}</strong> was auto-blocked (${data.latest_alert.threat_type || 'threat'})`;
                    showAdminToast('THREAT DETECTED', msg);
                }
                lastUnreadCount = data.unread_count;
            }
        } catch (e) {}
    }

    // Connect admin SocketIO room
    try {
        const socket = io();
        socket.on('admin_threat_alert', function(data) {
            const msg = `User <strong>${data.sender_name || 'User'}</strong> was auto-blocked (${data.threat_type || 'threat'})`;
            showAdminToast('THREAT DETECTED', msg);
            checkAdminAlerts();
        });
    } catch(e) {}

    setInterval(checkAdminAlerts, 3000);
    checkAdminAlerts();
})();
</script>
