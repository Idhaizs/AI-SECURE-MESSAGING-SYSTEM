{% extends 'base.html' %}
{% block title %}Security Verification - AI Secure Messaging{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-shield-check"></i>
            <h2>Security Verification</h2>
            <p>Please answer your security question to continue</p>
        </div>
        <div class="security-question-box">
            <p><i class="fas fa-question-circle"></i> {{ question }}</p>
        </div>
        <form method="POST" action="{{ url_for('auth.user_verify') }}">
            <div class="form-group">
                <label>Your Answer</label>
                <div style="position:relative;">
                    <input type="password" id="securityAnswerInput" name="code" placeholder="Enter your answer" required autofocus style="padding-right:40px;">
                    <button type="button" onclick="togglePasswordVisibility('securityAnswerInput', 'securityAnswerEye')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#64748b; cursor:pointer; padding:4px; font-size:14px;" title="Show/Hide Answer">
                        <i class="fas fa-eye-slash" id="securityAnswerEye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                Verify & Login
            </button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    }
}
</script>
{% endblock %}
