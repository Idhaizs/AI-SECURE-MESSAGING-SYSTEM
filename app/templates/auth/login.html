{% extends 'base.html' %}
{% block title %}Login - AI Secure Messaging{% endblock %}
{% block content %}
<div class="auth-wrapper" style="flex-direction:column;">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;margin:0 auto;">
        <div class="auth-card" style="width:100%;box-sizing:border-box;">
            <div class="auth-header">
                <i class="fas fa-shield-halved"></i>
                <h2>Login</h2>
                <p>AI Secure Messaging System</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" name="username" placeholder="Enter your User ID" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position:relative;">
                        <input type="password" id="userPasswordInput" name="password" placeholder="Enter your password" required style="padding-right:40px;">
                        <button type="button" onclick="togglePasswordVisibility('userPasswordInput', 'userPasswordEye')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#64748b; cursor:pointer; padding:4px; font-size:14px;" title="Show/Hide Password">
                            <i class="fas fa-eye-slash" id="userPasswordEye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    Login
                </button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
                <span>|</span>
                <a href="{{ url_for('auth.register') }}">Register</a>
                <span>|</span>
                <a href="{{ url_for('auth.index') }}">Back</a>
            </div>
        </div>
        
        <!-- Link placed DIRECTLY UNDERNEATH the white card -->
        <div style="text-align:center;margin-top:18px;width:100%;">
            <a href="#" onclick="openStatusModal(); return false;" style="color:#93c5fd;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);padding:10px 22px;border-radius:20px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.25);transition:all 0.2s ease;">
                <i class="fas fa-search" style="color:#60a5fa;"></i> Check Registration Status
            </a>
        </div>
    </div>
</div>

<!-- Modal: Check Status (2-Step Security Verification) -->
<div class="modal-overlay" id="statusModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.6);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:white;width:90%;max-width:450px;border-radius:12px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;font-size:18px;color:#1e293b;">Check Status & Find User ID</h3>
            <button onclick="closeStatusModal()" style="background:none;border:none;font-size:18px;color:#94a3b8;cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        
        <!-- Step 1 Form -->
        <div id="statusStep1">
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;font-weight:bold;color:#475569;margin-bottom:6px;">Username or Email Address</label>
                <input type="text" id="statusIdentifier" placeholder="e.g. ahmad or ahmad@example.com" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>
        </div>
        
        <!-- Step 2 Form (Security Question Verification) -->
        <div id="statusStep2" style="display:none;">
            <div style="background:#f1f5f9;padding:10px 14px;border-radius:8px;margin-bottom:14px;">
                <div style="font-size:11px;font-weight:bold;color:#64748b;text-transform:uppercase;">Account Found</div>
                <div style="font-weight:bold;color:#1e293b;font-size:14px;" id="statusAccountName"></div>
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;font-weight:bold;color:#475569;margin-bottom:6px;">Security Question</label>
                <div id="statusQuestionText" style="font-size:13px;color:#1d4ed8;font-weight:bold;background:#eff6ff;padding:10px;border-radius:6px;margin-bottom:10px;border:1px solid #bfdbfe;"></div>
                <label style="display:block;font-size:13px;font-weight:bold;color:#475569;margin-bottom:6px;">Your Security Answer</label>
                <input type="text" id="statusAnswer" placeholder="Enter your answer" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
            </div>
        </div>

        <div id="statusResult" style="display:none;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;white-space:pre-line;line-height:1.5;"></div>
        
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="closeStatusModal()" class="btn" style="background:#f1f5f9;color:#475569;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;">Cancel</button>
            <button id="btnSubmitStatusStep1" onclick="submitCheckStatusStep1()" class="btn btn-primary" style="padding:8px 18px;border-radius:6px;cursor:pointer;">Next</button>
            <button id="btnSubmitStatusStep2" onclick="submitCheckStatusStep2()" class="btn btn-primary" style="display:none;padding:8px 18px;border-radius:6px;cursor:pointer;">Verify & Reveal User ID</button>
        </div>
    </div>
</div>

<script>
let currentCheckIdentifier = '';

function togglePasswordVisibility(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    }
}

function openStatusModal() {
    document.getElementById('statusModal').style.display = 'flex';
    document.getElementById('statusStep1').style.display = 'block';
    document.getElementById('statusStep2').style.display = 'none';
    document.getElementById('btnSubmitStatusStep1').style.display = 'inline-block';
    document.getElementById('btnSubmitStatusStep2').style.display = 'none';
    document.getElementById('statusResult').style.display = 'none';
    document.getElementById('statusIdentifier').value = '';
    document.getElementById('statusAnswer').value = '';
    currentCheckIdentifier = '';
}

function closeStatusModal() {
    document.getElementById('statusModal').style.display = 'none';
}

async function submitCheckStatusStep1() {
    const val = document.getElementById('statusIdentifier').value.trim();
    const resultDiv = document.getElementById('statusResult');
    if (!val) {
        alert('Please enter your username or email address.');
        return;
    }
    
    try {
        const formData = new FormData();
        formData.append('step', '1');
        formData.append('identifier', val);
        const res = await fetch("{{ url_for('auth.check_status') }}", { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.success) {
            currentCheckIdentifier = val;
            resultDiv.style.display = 'none';
            document.getElementById('statusStep1').style.display = 'none';
            document.getElementById('statusStep2').style.display = 'block';
            document.getElementById('statusAccountName').innerText = `${data.full_name} (${data.username})`;
            document.getElementById('statusQuestionText').innerText = data.question;
            document.getElementById('btnSubmitStatusStep1').style.display = 'none';
            document.getElementById('btnSubmitStatusStep2').style.display = 'inline-block';
        } else {
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#fee2e2';
            resultDiv.style.color = '#991b1b';
            resultDiv.style.border = '1px solid #fca5a5';
            resultDiv.innerText = '❌ ' + (data.error || 'User not found.');
        }
    } catch (err) {
        alert('Error checking status: ' + err.message);
    }
}

async function submitCheckStatusStep2() {
    const answer = document.getElementById('statusAnswer').value.trim();
    const resultDiv = document.getElementById('statusResult');
    if (!answer) {
        alert('Please enter your security question answer.');
        return;
    }
    
    try {
        const formData = new FormData();
        formData.append('step', '2');
        formData.append('identifier', currentCheckIdentifier);
        formData.append('answer', answer);
        const res = await fetch("{{ url_for('auth.check_status') }}", { method: 'POST', body: formData });
        const data = await res.json();
        
        resultDiv.style.display = 'block';
        if (data.success) {
            if (data.status === 'active') {
                resultDiv.style.background = '#d1fae5';
                resultDiv.style.color = '#065f46';
                resultDiv.style.border = '1px solid #a7f3d0';
            } else if (data.status === 'pending') {
                resultDiv.style.background = '#fef3c7';
                resultDiv.style.color = '#92400e';
                resultDiv.style.border = '1px solid #fde68a';
            } else {
                resultDiv.style.background = '#fee2e2';
                resultDiv.style.color = '#991b1b';
                resultDiv.style.border = '1px solid #fca5a5';
            }
            resultDiv.innerText = data.message;
        } else {
            resultDiv.style.background = '#fee2e2';
            resultDiv.style.color = '#991b1b';
            resultDiv.style.border = '1px solid #fca5a5';
            resultDiv.innerText = data.error || 'Incorrect Security Answer.';
        }
    } catch (err) {
        alert('Error verifying security answer: ' + err.message);
    }
}
</script>
{% endblock %}
