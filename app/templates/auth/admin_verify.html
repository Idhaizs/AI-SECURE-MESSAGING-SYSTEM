{% extends 'base.html' %}
{% block title %}Admin Verification - AI Secure Messaging{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header admin">
            <i class="fas fa-shield-halved"></i>
            <h2>What is your code?</h2>
            <p>Admin security verification</p>
        </div>
        <form method="POST" action="{{ url_for('auth.admin_verify') }}">
            <div class="form-group">
                <div style="position:relative;">
                    <input type="password" id="adminAnswerInput" name="code" placeholder="Enter your code" required autofocus style="padding-right:40px;">
                    <button type="button" onclick="togglePasswordVisibility('adminAnswerInput', 'adminAnswerEye')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#64748b; cursor:pointer; padding:4px; font-size:14px;" title="Show/Hide Code">
                        <i class="fas fa-eye-slash" id="adminAnswerEye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-admin btn-full">
                Submit
            </button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.admin_login') }}">Back to Login</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    }
}
</script>
{% endblock %}
