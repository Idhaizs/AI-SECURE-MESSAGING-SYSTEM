{% extends 'base.html' %}
{% block title %}Admin Login - AI Secure Messaging{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header admin">
            <i class="fas fa-user-shield"></i>
            <h2>Admin Login</h2>
            <p>AI Secure Messaging System</p>
        </div>
        <form method="POST" action="{{ url_for('auth.admin_login') }}">
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="username" placeholder="Enter your User ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="adminPasswordInput" name="password" placeholder="Enter your password" required style="padding-right:40px;">
                    <button type="button" onclick="togglePasswordVisibility('adminPasswordInput', 'adminPasswordEye')" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#64748b; cursor:pointer; padding:4px; font-size:14px;" title="Show/Hide Password">
                        <i class="fas fa-eye-slash" id="adminPasswordEye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-admin btn-full">Login</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.index') }}">Back</a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    }
}
</script>
{% endblock %}
